# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Secret Scanner — migrated to the bounded scanner in hyperpolymath/cicd-suite.
#
# The suite workflow is a *direct caller* target: it re-reads `.jobs.scan.uses`
# from this file (via `github.workflow_ref`) and refuses to proceed unless the
# job id is `scan`, the repository is hyperpolymath/cicd-suite and the pin is a
# full 40-hex SHA. Do not move this call into a composite or a second workflow.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # No job-level `permissions` and no `secrets: inherit`: the pinned
    # reusable asks for `contents: read` only and consumes no caller secrets.
    # The previous grants (`pull-requests: write` for a PR summary comment,
    # `actions: read` for workflow-run metadata) belonged to the legacy
    # standards bundle and are deliberately not carried over.
    #
    # `scan / gitleaks` remains a required context on main (Secret-Scan-Floor):
    # the reusable's job id is `gitleaks`, so the context name is unchanged.
    #
    # The actions.lock entry for this workflow declares
    # `actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1` because the
    # runner validates refs reached *through* the reusable against the calling
    # workflow's entry. `gh actions-lock` only extracts step-level `uses:` and
    # cannot derive that edge, so a regeneration would silently drop it.
    uses: hyperpolymath/cicd-suite/.github/workflows/secret-scanner-reusable.yml@4404c3c0474e17753fe7689f3485c02890aac113
    with:
      # Introduced-commit PR ranges are still awaiting security-owner approval,
      # so every run keeps scanning full history (the default; stated here so a
      # future default change cannot quietly narrow this repository's coverage).
      fast-pr: false
