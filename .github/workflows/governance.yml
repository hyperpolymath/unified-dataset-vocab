# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# governance.yml — single wrapper calling the shared estate governance bundle
# in metadatastician/standards instead of carrying per-repo copies.
#
# Replaces the per-repo governance scaffolding removed in the same commit:
#   quality.yml, guix-nix-policy.yml, npm-bun-blocker.yml, ts-blocker.yml,
#   security-policy.yml, rsr-antipattern.yml, wellknown-enforcement.yml,
#   workflow-linter.yml
#
# Load-bearing build/security workflows stay standalone in the repo
# (rust-ci, codeql, dependabot, release, scan/mirror/pages plumbing).

# NOTE: the reusable lives under metadatastician/standards; the repository was
# transferred out of the hyperpolymath org, and Actions does not follow the
# rename. This pin is also a commit whose callee actions.lock is runner-valid:
# GitHub validates a called reusable against the CALLEE's lock at the called
# SHA and rejects a dependency record whose `ref:` is its own commit SHA.
# The previous pin (fad242d, 2026-09-07) had exactly that defect, which failed
# every job at `Set up job` with "invalid lockfile pin".
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@1725bebd3773ea25627479f813283abf1c497a85
