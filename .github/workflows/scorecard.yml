# This workflow is managed by gh actions-lock.
# NOTE: the reusable lives under metadatastician/standards; the repository was
# transferred out of the hyperpolymath org. Actions does not follow the rename,
# so a hyperpolymath/standards ref fails at startup with zero jobs.
name: Scorecards supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'

permissions: read-all

jobs:
  analysis:
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@81dbf2dd854b1444fd6236fa2352474383b2c2b9
    permissions:
      contents: read
      security-events: write
      id-token: write
    secrets: inherit
